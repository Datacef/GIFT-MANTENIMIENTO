apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: mmtto
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate   # el PVC RWO solo puede montarse por un nodo
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: mmtto/ollama:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          envFrom:
            - secretRef:
                name: mmtto-env
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          # Sin liveness estricto: la descarga inicial del modelo puede tardar
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: mmtto
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: mmtto
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
