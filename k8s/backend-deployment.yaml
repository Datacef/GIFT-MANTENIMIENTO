apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mmtto
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mmtto/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1337
          envFrom:
            - secretRef:
                name: mmtto-env
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /health
              port: 1337
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 1337
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mmtto
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 1337
      targetPort: 1337
